name: AERIS-Frontend Tests

on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'aeris-*.js'
      - 'buchhaltung/**'
      - 'test/**'
      - 'package.json'
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'aeris-*.js'
      - 'buchhaltung/**'
      - 'test/**'
      - 'package.json'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
